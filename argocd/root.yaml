# 뿌리 Application (App of Apps, #20). argocd/apps/local 의 자식 넷을 만든다
# syncPolicy 가 없다 = manual : 사람이 root 를 Sync 해야 자식이 생기거나 바뀐다 (로컬은 손으로 시작, ADR #66 ①)
# 레포를 이 브랜치에 맞춰 따라가므로 targetRevision 은 다섯 곳(root · 자식 넷)을 같이 고친다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/2026-techeer-project-team-b/monimo-deploy
    targetRevision: feat/20-local-argocd
    path: argocd/apps/local
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
