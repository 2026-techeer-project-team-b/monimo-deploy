# 번호 0 : 네임스페이스 data · apm · shop (Prune=false 라 ArgoCD 가 지우지 않는다)
# 자식은 automated 다 (prune · selfHeal 끔) : root 가 만들면 스스로 sync 해서 Healthy 가 돼야 root 가 다음 번호로 간다.
# 전부 manual 이면 root sync 가 자식마다 멈춰 선다 (research.md 9절). 사람이 누르는 입구는 root 하나다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/2026-techeer-project-team-b/monimo-deploy
    targetRevision: feat/20-local-argocd
    path: overlays/local/0-namespaces
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    # 실패한 sync 를 다시 해 본다 : automated 는 같은 커밋의 실패를 스스로 다시 하지 않는다 (준비 Job 하나가 늦게 실패하면 멈춰 선다)
    retry:
      limit: 3
      backoff: { duration: 10s, factor: 2, maxDuration: 2m }
    syncOptions:
      - ServerSideApply=true
