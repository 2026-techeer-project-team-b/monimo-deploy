# 번호 2 : 준비 Job 셋 (토픽 · PG 마이그레이션 · ClickHouse 마이그레이션). Sync hook 이라 sync 마다 새로 돈다
# 자식은 automated 다 (prune · selfHeal 끔) : root 가 만들면 스스로 sync 해서 Healthy 가 돼야 root 가 다음 번호로 간다.
# 전부 manual 이면 root sync 가 자식마다 멈춰 선다 (research.md 9절). 사람이 누르는 입구는 root 하나다
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-jobs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/2026-techeer-project-team-b/monimo-deploy
    targetRevision: feat/20-local-argocd
    path: overlays/local/2-jobs
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - ServerSideApply=true
