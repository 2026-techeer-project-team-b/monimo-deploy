# 번호 3 : 준비 Job 셋 + 수집기 · 적재 처리기 (up-local.sh 의 2 · 3)
# 준비 Job 셋은 PreSync hook 이다 : 이 자식이 sync 할 때 Job 이 먼저 돌고, 셋 다 성공해야 앱을 넣는다 (표 · 토픽 없이 앱이 뜨면 꺼진다)
# Job 만 든 자식(2-jobs)을 따로 두면 안 됐다 (2026-10-19 실측, research.md 9절) : hook 은 「평소 자원」이 아니라서
# Job 만 있는 자식은 처음부터 Synced 로 보이고, automated 는 OutOfSync 일 때만 sync 하므로 Job 이 한 번도 안 돈다
# 그래서 overlay 두 폴더를 sources 둘로 한 자식에 묶는다. overlay 는 그대로라 up-local.sh 길은 안 바뀐다
#
# 자식은 automated 다 (prune · selfHeal 끔) : root 가 만들면 스스로 sync 해서 Healthy 가 돼야 root 가 다음 번호로 간다.
# 전부 manual 이면 root sync 가 자식마다 멈춰 선다 (research.md 9절). 사람이 누르는 입구는 root 하나다
# 이 자식이 sync 할 때마다(수집기 값 하나를 바꿔도) 준비 Job 셋이 다시 돈다 : 셋 다 다시 돌려도 안전하다 (토픽은 --if-not-exists, Flyway 는 이미 한 버전을 건너뛴다)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://github.com/2026-techeer-project-team-b/monimo-deploy
      targetRevision: develop
      path: overlays/local/2-jobs
    - repoURL: https://github.com/2026-techeer-project-team-b/monimo-deploy
      targetRevision: develop
      path: overlays/local/3-apps
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - ServerSideApply=true
