apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps/collector
  - ../../../apps/ingester
# 로컬 빌드 태그. 같은 태그로 다시 빌드하면 파드가 안 바뀐다 : kubectl -n apm rollout restart deployment/<이름>
images:
  - name: monimo-local.invalid/collector
    newName: monimo/collector
    newTag: dev
  - name: monimo-local.invalid/ingester
    newName: monimo/ingester
    newTag: dev
