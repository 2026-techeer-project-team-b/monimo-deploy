# PostgreSQL 한 대. 공식 이미지 StatefulSet (ADR #62 F). 설정은 backend compose.yaml 의 postgres 를 옮겼다
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: monimo-infra
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: monimo-infra
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: monimo
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: monimo-db, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: monimo-db, key: POSTGRES_PASSWORD }
            # 볼륨 바로 아래는 lost+found 가 생길 수 있어(EBS 등) initdb 가 "비어 있지 않다" 로 멈춘다. 한 칸 아래에 둔다
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d monimo"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # apiVersion · kind 를 적는다 : 안 적으면 클러스터가 채운 값과 달라 ArgoCD 가 계속 OutOfSync 로 본다 (#20 실측)
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi       # EKS 출발값은 4~6단계에서 정한다. 로컬은 overlays/local 이 줄인다
