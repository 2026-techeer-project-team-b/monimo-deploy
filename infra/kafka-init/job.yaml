# 토픽 만들기 (한 번 돌고 끝나는 Job). raw 7일 · raw.dlq 30일 보관 (ADR #34). backend compose.yaml 의 kafka-init 명령 그대로, 주소만 바꿨다
# 이미 있으면 --if-not-exists 라 아무것도 안 한다 : 다시 돌려도 안전하다
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  # ArgoCD PreSync hook (#20) : 앱(3-apps)을 넣기 전에 지우고 새로 만들어 돌고, 성공해야 앱이 들어간다 (Job 은 고칠 수 없는 칸이 있어 그대로 다시 넣으면 막힌다). kubectl apply 는 이 주석을 무시한다
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: kafka-init
    app.kubernetes.io/part-of: monimo-init
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-init
        app.kubernetes.io/part-of: monimo-init
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: kafka-init
          image: apache/kafka:3.9.2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              B=kafka-0.kafka.data.svc.cluster.local:29092
              T=/opt/kafka/bin/kafka-topics.sh
              for i in $(seq 1 60); do
                /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server $B > /dev/null 2>&1 && break
                sleep 2
              done
              $T --bootstrap-server $B --create --if-not-exists --topic raw     --partitions 3 --replication-factor 1 --config retention.ms=604800000
              $T --bootstrap-server $B --create --if-not-exists --topic raw.dlq --partitions 1 --replication-factor 1 --config retention.ms=2592000000
              $T --bootstrap-server $B --list
