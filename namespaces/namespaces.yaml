# 네임스페이스 셋 (ADR #62). argocd 네임스페이스는 ArgoCD 설치(argocd/install, scripts/up-argocd.sh)가 만든다
# Prune=false (#20) : 파일에서 빠져도 ArgoCD 가 지우지 않는다. 네임스페이스를 지우면 안의 PVC(저장소 데이터)가 같이 지워진다
#   data : 저장소 셋 (Kafka · ClickHouse · PostgreSQL) 과 그 준비 Job
#   apm  : 우리 서비스 (이번엔 수집기 · 적재 처리기)
#   shop : 쇼핑몰 (이번엔 비어 있다, #14 범위 밖)
apiVersion: v1
kind: Namespace
metadata:
  name: data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/part-of: monimo
---
apiVersion: v1
kind: Namespace
metadata:
  name: apm
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/part-of: monimo
