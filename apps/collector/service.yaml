# 클러스터 안 주소 collector.apm.svc.cluster.local. 같은 네임스페이스에서는 collector:4317 (서버 인증서 이름과 같다)
# 입구(인그레스)에는 두지 않는다 (#11)
apiVersion: v1
kind: Service
metadata:
  name: collector
  labels:
    app.kubernetes.io/name: collector
    app.kubernetes.io/part-of: monimo-apm
spec:
  selector:
    app.kubernetes.io/name: collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      appProtocol: grpc
    - name: http
      port: 8081
      targetPort: http
    - name: management
      port: 18081
      targetPort: management
