# 받는 요청이 없지만(Kafka 에서 꺼낸다) 점검 스크립트 · 나중의 메트릭 수집이 관리 포트를 읽는다
apiVersion: v1
kind: Service
metadata:
  name: ingester
  labels:
    app.kubernetes.io/name: ingester
    app.kubernetes.io/part-of: monimo-apm
spec:
  selector:
    app.kubernetes.io/name: ingester
  ports:
    - name: http
      port: 8082
      targetPort: http
    - name: management
      port: 18082
      targetPort: management
